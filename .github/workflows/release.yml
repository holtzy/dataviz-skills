name: Release

# Push a tag like v1.0.0 → a GitHub release with one zip per skill + an all-skills zip.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip each skill
        run: |
          mkdir -p dist
          for skill in dataviz-*/*/; do
            name="$(basename "$skill")"
            (cd "$(dirname "$skill")" && zip -r "../dist/${name}.zip" "$name" -x '*.DS_Store')
          done
          zip -r dist/dataviz-skills-all.zip dataviz-theory dataviz-tech -x '*.DS_Store'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
