name: Release

# Push a tag like v1.0.0 → a GitHub release with one zip per skill + an all-skills zip.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip each skill
        run: |
          mkdir -p dist
          skills=()
          for file in */SKILL.md; do
            name="$(dirname "$file")"
            skills+=("$name")
            zip -r "dist/${name}.zip" "$name" -x '*.DS_Store' '*/tests/*'
          done
          zip -r dist/dataviz-skills-all.zip "${skills[@]}" -x '*.DS_Store' '*/tests/*'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
